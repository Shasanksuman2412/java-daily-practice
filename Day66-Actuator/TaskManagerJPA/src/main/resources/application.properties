server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
spring.datasource.username=${DB_USER:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1sZWFybmluZy1qd3QtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=3600000

# New today: only health is exposed by default - explicitly opt in to
# the others, since they can reveal internal details not meant for the
# public internet (see SecurityConfig for how each is locked down).
management.endpoints.web.exposure.include=health,info,metrics
# show DETAILED health info (like the database check status) only to
# authenticated requests - keeps the public health check minimal (just UP/DOWN)
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN

# Custom fields surfaced at /actuator/info
info.app.name=Task Manager API
info.app.description=Built incrementally across Days 49-66 of daily Java practice
info.app.java-version=17
