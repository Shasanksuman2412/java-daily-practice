name: Task Manager CI

on:
  push:
    branches: [main]
    paths:
      - 'Day66-Actuator/TaskManagerJPA/**'
  pull_request:
    branches: [main]
    paths:
      - 'Day66-Actuator/TaskManagerJPA/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day66-Actuator/TaskManagerJPA

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test

      - name: Package the application
        run: mvn package -DskipTests

  build-image:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day66-Actuator/TaskManagerJPA

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taskmanager-api:${{ github.sha }} .
