name: Task Manager CI

# Updated today: paths now point at Day64-PostgreSQL/TaskManagerJPA
# instead of Day62's folder. Tests still run against fast, in-memory H2
# (see src/test/resources/application.properties) - no real Postgres
# needed just to run "mvn test" in CI.
on:
  push:
    branches: [main]
    paths:
      - 'Day64-PostgreSQL/TaskManagerJPA/**'
  pull_request:
    branches: [main]
    paths:
      - 'Day64-PostgreSQL/TaskManagerJPA/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day64-PostgreSQL/TaskManagerJPA

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test

      - name: Package the application
        run: mvn package -DskipTests

  build-image:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day64-PostgreSQL/TaskManagerJPA

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taskmanager-api:${{ github.sha }} .
