# Test-only configuration - completely SEPARATE from the main app's
# file-based database. Using an in-memory H2 instance means every test
# run starts with a clean slate, and never touches (or pollutes) the real
# taskdb file used when you run the app normally.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

