# Deliberately UNCHANGED from Day 58/59 - tests still use fast, in-memory
# H2, not the real PostgreSQL the app now runs on in dev/production.
#
# This is a genuine, common trade-off: fast tests vs perfect environment
# parity. H2 and PostgreSQL behave almost identically for our simple
# queries here, so this is fine for our purposes - but it's not
# GUARANTEED, since some SQL features/behaviors differ between databases.
# Real teams often use Testcontainers (a real, disposable Postgres
# container spun up just for tests) when that parity gap actually
# matters - a good future topic, not required today.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

