server.port=${PORT:8080}

# New today: a REAL PostgreSQL connection, driven entirely by environment
# variables with sensible local defaults - same pattern as Day 63's $PORT.
# Locally, these match docker-compose.yml's postgres service. In
# production (Render), these get set automatically from the attached
# managed database (see render.yaml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
spring.datasource.username=${DB_USER:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}
spring.datasource.driverClassName=org.postgresql.Driver

# Hibernate auto-detects it's talking to PostgreSQL from the JDBC URL
# itself - no dialect needs to be configured manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console no longer applies - there's no H2 database in the running
# app anymore, only in tests (see src/test/resources/application.properties)

jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1sZWFybmluZy1qd3QtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=3600000
