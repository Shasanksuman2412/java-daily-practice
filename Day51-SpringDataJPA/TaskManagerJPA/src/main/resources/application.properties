# H2 database, file-based so data persists between server restarts
spring.datasource.url=jdbc:h2:file:./taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update: Hibernate creates/updates the table schema automatically
# based on the @Entity classes - no manual CREATE TABLE needed (unlike Day 45's JDBC)
spring.jpa.hibernate.ddl-auto=update

# Show the actual SQL Hibernate generates - useful for learning what's happening
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - a browser-based database viewer at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
