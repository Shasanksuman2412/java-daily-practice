# Deliberately UNCHANGED in spirit from Day 58/59/64 - tests still use
# fast, in-memory H2 with Hibernate auto-DDL, not Flyway-managed Postgres.
#
# New today: spring.flyway.enabled=false is now EXPLICIT, since Flyway is
# on the classpath (for the main app) but our H2 migration SQL doesn't
# exist - without disabling it here, tests would fail trying to run
# Postgres-flavored SQL (like SERIAL) against H2.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

