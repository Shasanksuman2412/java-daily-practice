server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
spring.datasource.username=${DB_USER:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}
spring.datasource.driverClassName=org.postgresql.Driver

# Changed today: validate instead of update - Hibernate now only CHECKS
# that the entities match the database schema, it never modifies
# anything. Flyway (below) is the ONLY thing allowed to change the schema
# now, applying versioned SQL files in order on every startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is on by default once the dependency is present, but being
# explicit here documents the intent clearly.
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1sZWFybmluZy1qd3QtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=3600000
