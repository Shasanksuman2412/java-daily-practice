# Changed today: the database path now points into /app/data, a folder
# meant to be mounted as a Docker VOLUME (see docker-compose.yml). This
# way, stopping/removing the container doesn't lose your data - only
# deleting the actual ./data folder on your real machine would.
spring.datasource.url=jdbc:h2:file:/app/data/taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# jwt.secret is overridden via an environment variable in docker-compose.yml
# for real deployments - this value is just a safe local default.
jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1sZWFybmluZy1qd3QtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=3600000
