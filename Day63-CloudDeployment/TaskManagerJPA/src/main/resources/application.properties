# New today: server.port reads the PORT environment variable if the
# hosting platform sets one (most cloud platforms assign a DYNAMIC port),
# falling back to 8080 for local development where PORT is never set.
server.port=${PORT:8080}

# NOTE: H2 file-based storage is fine for local dev and demos, but most
# free-tier cloud hosting uses EPHEMERAL disks - anything written here
# gets wiped on every redeploy/restart. A real production deployment
# would swap this for a managed database (e.g. PostgreSQL) instead.
spring.datasource.url=jdbc:h2:file:/app/data/taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1sZWFybmluZy1qd3QtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expirationMs=3600000
